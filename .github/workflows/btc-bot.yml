
name: BTC 15m Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-15m-paper-bot
  cancel-in-progress: false

jobs:
  paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BTC paper signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_MODE: paper
        run: python -u main.py

      - name: Save paper-trading records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f paper_state.json ]; then
            git add paper_state.json
          fi

          if [ -f paper_trades.csv ]; then
            git add paper_trades.csv
          fi

          if git diff --cached --quiet; then
            echo "No new paper-trading records to save."
          else
            git commit -m "Update paper-trading records"
            git push
          fi
