
name: BTC 15-Minute Paper Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-paper-signals
  cancel-in-progress: false

jobs:
  paper-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRADING_MODE: paper

    steps:
      - name: Check out bot code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run BTC paper signal bot
        run: |
          if [ -f main.py ]; then
            python -u main.py
          elif [ -f bot.py ]; then
            python -u bot.py
          else
            echo "ERROR: Neither main.py nor bot.py was found."
            exit 1
          fi

      - name: Save paper-trading records
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json paper_trades.csv
          if git diff --cached --quiet; then
            echo "No new records to save."
          else
            git commit -m "Update paper-trading records"
            git push
          fi